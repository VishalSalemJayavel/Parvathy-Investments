<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none">
  <!-- Lotus outer leaves left -->
  <path d="M30 110 Q20 75 55 65 Q45 90 70 100Z" fill="#3a7d44" opacity="0.85"/>
  <path d="M18 118 Q8 80 48 68 Q35 95 62 108Z" fill="#2d6535" opacity="0.7"/>
  <path d="M50 105 Q38 72 72 58 Q62 85 82 97Z" fill="#4a9d58" opacity="0.9"/>

  <!-- Lotus outer leaves right -->
  <path d="M290 110 Q300 75 265 65 Q275 90 250 100Z" fill="#3a7d44" opacity="0.85"/>
  <path d="M302 118 Q312 80 272 68 Q285 95 258 108Z" fill="#2d6535" opacity="0.7"/>
  <path d="M270 105 Q282 72 248 58 Q258 85 238 97Z" fill="#4a9d58" opacity="0.9"/>

  <!-- Lotus mid leaves left -->
  <path d="M75 98 Q58 58 95 42 Q90 72 108 88Z" fill="#3a7d44" opacity="0.95"/>
  <path d="M95 90 Q82 50 118 35 Q112 65 125 82Z" fill="#4a9d58"/>

  <!-- Lotus mid leaves right -->
  <path d="M245 98 Q262 58 225 42 Q230 72 212 88Z" fill="#3a7d44" opacity="0.95"/>
  <path d="M225 90 Q238 50 202 35 Q208 65 195 82Z" fill="#4a9d58"/>

  <!-- Center gold petal / teardrop -->
  <ellipse cx="160" cy="62" rx="22" ry="34" fill="url(#goldPetal)" transform="rotate(-8 160 62)"/>
  <ellipse cx="160" cy="62" rx="22" ry="34" fill="url(#goldPetalR)" transform="rotate(8 160 62)"/>
  <ellipse cx="160" cy="58" rx="16" ry="28" fill="url(#goldCenter)"/>

  <!-- Bar charts -->
  <rect x="140" y="68" width="9" height="22" rx="1.5" fill="#2d6535"/>
  <rect x="152" y="58" width="9" height="32" rx="1.5" fill="#3a7d44"/>
  <rect x="164" y="63" width="9" height="27" rx="1.5" fill="#2d6535"/>
  <rect x="176" y="55" width="9" height="35" rx="1.5" fill="#3a7d44"/>

  <!-- Gold arrow swooping up -->
  <path d="M130 88 Q160 50 200 32" stroke="#C5A256" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Arrow head -->
  <polygon points="200,32 188,30 196,42" fill="#C5A256"/>

  <!-- Company name: PARVATHY -->
  <text x="160" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1A2B5F" text-anchor="middle" letter-spacing="3">PARVATHY</text>

  <!-- Divider lines and INVESTMENTS -->
  <line x1="72" y1="136" x2="112" y2="136" stroke="#C5A256" stroke-width="1.2"/>
  <text x="160" y="140" font-family="Georgia, serif" font-size="10" fill="#C5A256" text-anchor="middle" letter-spacing="4" font-weight="400">INVESTMENTS</text>
  <line x1="208" y1="136" x2="248" y2="136" stroke="#C5A256" stroke-width="1.2"/>

  <defs>
    <linearGradient id="goldPetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B978"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="goldPetalR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4B978" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C5A256" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="goldCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D060"/>
      <stop offset="50%" stop-color="#C5A256"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
</svg>
